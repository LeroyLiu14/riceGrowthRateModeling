name: Run TabICLv2 deidentified pig models

on:
  push:
    branches:
      - 'tabiclv2-public-run-*'
    paths:
      - 'tabiclv2_public_run/**'
      - '.github/workflows/tabiclv2_public_execute.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  TOKENIZERS_PARALLELISM: 'false'
  HF_HUB_DISABLE_TELEMETRY: '1'
  INPUT_DOWNLOAD_URL: 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-cc84-8209-b5bc-38ab7118f0d0/raw?se=2026-09-29T15%3A40%3A01Z&sp=r&sv=2026-02-06&sr=b&scid=5b711ad5-b172-56ba-b316-bed49f62c68c&skoid=fe2e0858-51c5-47e9-acb7-46ebb9a0f396&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T04%3A02%3A15Z&ske=2026-09-30T04%3A02%3A15Z&sks=b&skv=2026-02-06&sig=vEO1ehrtKTsFRXhPLDPNwHo5smzI9qPBieg7tPIYJ0M%3D'

jobs:
  run-tabiclv2:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download deidentified analysis matrix
        shell: bash
        run: |
          mkdir -p tabiclv2_public_run
          curl --fail --location --retry 5 --retry-delay 2 "$INPUT_DOWNLOAD_URL" -o tabiclv2_public_run/inputs.zip
          echo '1725797368aff62ab9585cf6c1203d36158c991e0c0c2c74a261a7885ad18080  tabiclv2_public_run/inputs.zip' | sha256sum -c -
          unzip -t tabiclv2_public_run/inputs.zip

      - name: Install CPU runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'tabicl==2.2.0' 'pandas>=2.2' 'numpy>=1.26' 'scikit-learn>=1.5' 'scipy>=1.11'

      - name: Environment check
        run: |
          python -m py_compile tabiclv2_public_run/runner.py
          python - <<'PY'
          import tabicl, torch
          print('tabicl', getattr(tabicl, '__version__', 'unknown'))
          print('torch', torch.__version__, 'cuda', torch.cuda.is_available())
          PY

      - name: Run TabICLv2 grouped CV and chronological test
        run: |
          python tabiclv2_public_run/runner.py \
            --input-zip tabiclv2_public_run/inputs.zip \
            --work-dir tabiclv2_public_run/inputs \
            --output-dir tabiclv2_public_run/results \
            --datasets B0 D0 D1 D2 \
            --tasks classification regression \
            --n-estimators 1 \
            --cv-folds 5 \
            --device cpu

      - name: Bundle results
        if: always()
        run: |
          cd tabiclv2_public_run
          zip -r tabiclv2_results_bundle.zip results || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tabiclv2-pig-weather-results
          path: |
            tabiclv2_public_run/tabiclv2_results_bundle.zip
            tabiclv2_public_run/results
          if-no-files-found: warn
          retention-days: 7
